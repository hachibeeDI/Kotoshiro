[package]
name = "kotoshiro"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "TODO を根に据えて Claude Code セッション群を司るツール"
license = "MIT"
repository = "https://github.com/hachibeeDI/Kotoshiro"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
